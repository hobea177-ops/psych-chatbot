<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>عقل — مساعد علم النفس</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0b10;
    --bg-panel: #12141c;
    --bg-input: #171a24;
    --bg-sidebar: #0d0e15;
    --border: #262a38;
    --violet: #8b7bff;
    --violet-dim: #4a3f8f;
    --teal: #4fd9c8;
    --text: #e7e6ee;
    --text-dim: #8b8ea3;
    --danger: #ff6b7a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: radial-gradient(ellipse at top left, #14172280, transparent 60%), var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans Arabic', sans-serif;
    height:100vh;
    display:flex;
    overflow:hidden;
  }
  #sidebar{
    width:260px;
    background: var(--bg-sidebar);
    border-left:1px solid var(--border);
    display:flex;
    flex-direction:column;
    flex-shrink:0;
  }
  #sidebar-header{ padding:16px; border-bottom:1px solid var(--border); }
  #newChatBtn{
    width:100%;
    background: transparent;
    border:1px solid var(--violet-dim);
    color: var(--violet);
    padding:10px;
    border-radius:10px;
    cursor:pointer;
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    transition:.15s;
  }
  #newChatBtn:hover{ background: var(--violet); color:#0a0b10; }
  #sessionList{ flex:1; overflow-y:auto; padding:8px; display:flex; flex-direction:column; gap:4px; }
  .session-item{
    display:flex; align-items:center; justify-content:space-between; gap:6px;
    padding:10px 12px;
    border-radius:8px;
    font-size:13px;
    color: var(--text-dim);
    cursor:pointer;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    transition:.15s;
  }
  .session-item:hover{ background: var(--bg-panel); color: var(--text); }
  .session-item.active{ background: var(--bg-panel); color: var(--text); border:1px solid var(--violet-dim); }
  .session-item .del-btn{
    opacity:0; background:none; border:none; color:var(--danger); cursor:pointer; font-size:14px; flex-shrink:0;
  }
  .session-item:hover .del-btn{ opacity:1; }
  #main{ flex:1; display:flex; flex-direction:column; min-width:0; }
  header{
    display:flex; align-items:center; gap:12px;
    padding:16px 24px;
    border-bottom:1px solid var(--border);
    background: var(--bg-panel);
  }
  .pulse-dot{
    width:10px; height:10px; border-radius:50%;
    background: var(--teal);
    box-shadow: 0 0 12px var(--teal);
    animation: pulse 2s infinite ease-in-out;
    flex-shrink:0;
  }
  @keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.35} }
  header h1{ font-size:16px; font-weight:600; letter-spacing:.3px; }
  header p{ font-size:12px; color:var(--text-dim); font-family:'JetBrains Mono', monospace; }
  #chat{
    flex:1;
    overflow-y:auto;
    padding:24px;
    display:flex;
    flex-direction:column;
    gap:18px;
    max-width:760px;
    width:100%;
    margin:0 auto;
  }
  .msg{ display:flex; flex-direction:column; gap:6px; max-width:85%; }
  .msg.user{ align-self:flex-end; align-items:flex-end; }
  .msg.bot{ align-self:flex-start; align-items:flex-start; }
  .bubble{
    padding:14px 16px;
    border-radius:14px;
    line-height:1.8;
    font-size:15px;
    white-space:pre-wrap;
  }
  .msg.user .bubble{
    background: linear-gradient(135deg, var(--violet), #6a5acd);
    color:#0a0b10;
    border-bottom-left-radius:4px;
    font-weight:500;
  }
  .msg.bot .bubble{
    background: var(--bg-panel);
    border:1px solid var(--border);
    border-bottom-right-radius:4px;
  }
  .sources{ display:flex; flex-wrap:wrap; gap:6px; font-family:'JetBrains Mono', monospace; font-size:11px; }
  .sources a{
    color: var(--teal);
    text-decoration:none;
    border:1px solid var(--violet-dim);
    padding:4px 8px;
    border-radius:20px;
    background:#171a2480;
    transition:.15s;
    direction:ltr;
    unicode-bidi:embed;
  }
  .sources a:hover{ border-color:var(--teal); background:#1a2626; }
  .disclaimer{
    font-size:11px; color:var(--text-dim); text-align:center;
    padding:8px 24px; font-family:'JetBrains Mono', monospace;
    border-top:1px solid var(--border);
  }
  #inputBar{
    display:flex; gap:10px; padding:16px 24px 20px;
    max-width:760px; width:100%; margin:0 auto;
  }
  #inputBar input{
    flex:1;
    background: var(--bg-input);
    border:1px solid var(--border);
    color:var(--text);
    padding:14px 16px;
    border-radius:12px;
    font-size:15px;
    font-family:inherit;
    outline:none;
  }
  #inputBar input:focus{ border-color: var(--violet); }
  #inputBar button{
    background: var(--violet);
    color:#0a0b10;
    border:none;
    padding:0 22px;
    border-radius:12px;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
    font-size:15px;
    transition:.15s;
  }
  #inputBar button:hover{ background: var(--teal); }
  #inputBar button:disabled{ opacity:.4; cursor:not-allowed; }
  .typing{ display:flex; gap:4px; padding:4px 0; }
  .typing span{ width:6px; height:6px; border-radius:50%; background:var(--text-dim); animation: bounce 1.2s infinite; }
  .typing span:nth-child(2){ animation-delay:.15s; }
  .typing span:nth-child(3){ animation-delay:.3s; }
  @keyframes bounce{ 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-5px)} }
  #chat::-webkit-scrollbar, #sessionList::-webkit-scrollbar{ width:6px; }
  #chat::-webkit-scrollbar-thumb, #sessionList::-webkit-scrollbar-thumb{ background:var(--border); border-radius:3px; }
  .empty-state{ color:var(--text-dim); font-size:13px; text-align:center; padding:24px 12px; }
</style>
</head>
<body>
